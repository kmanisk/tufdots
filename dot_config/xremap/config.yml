virtual_modifiers:
  - CapsLock

modmap:
  - name: Global Modmap
    remap:
      CapsLock:
        held: CapsLock
        alone: Esc
        alone_timeout_millis: 200
      RightCtrl: RightMeta

keymap:
  # --- Alacritty Universal Copy / Paste / Cut (Safe against SIGINT) ---
  - name: Alacritty Universal Clipboard
    application:
      only: ["Alacritty"]
    remap:
      M-c: C-S-c # Win+C -> Ctrl+Shift+C (safe copy without killing running processes)
      M-v: C-S-v # Win+V -> Ctrl+Shift+V (safe paste)
      M-x: C-S-c # Win+X -> Ctrl+Shift+C (copy selection)
      Alt-c: C-S-c
      CapsLock-DOT: C-S-v

  # --- General Universal Copy / Paste / Cut (All GUI Applications) ---
  - name: Universal Copy Paste
    application:
      not: ["Alacritty"]
    remap:
      M-c: C-c # Win+C -> Ctrl+C (Universal Copy)
      M-v: C-v # Win+V -> Ctrl+V (Universal Paste)
      M-x: C-x # Win+X -> Ctrl+X (Universal Cut)

  # --- CapsLock layer ---
  - name: CapsLock layer
    remap:
      # Navigation
      CapsLock-h: Left
      CapsLock-j: Down
      CapsLock-k: Up
      CapsLock-l: Right
      CapsLock-o: C-Left
      CapsLock-p: C-Right
      # Brightness (CapsLock + [ and CapsLock + ')
      CapsLock-LEFTBRACE: BrightnessUp
      CapsLock-APOSTROPHE: BrightnessDown
      # Actions
      CapsLock-n: Enter
      CapsLock-SEMICOLON: [End, Enter]
      CapsLock-i: [C-a, BackSpace]
      CapsLock-g: [C-a, C-c, Right]
      CapsLock-y: C-z
      CapsLock-SLASH: C-A-q
      CapsLock-m: BackSpace
      CapsLock-u: C-BackSpace
      CapsLock-d: Delete
      CapsLock-f: C-f
      CapsLock-DOT: C-v
      CapsLock-COMMA: [C-a, C-c]
      # F-key row
      CapsLock-1: F1
      CapsLock-2: F2
      CapsLock-3: F3
      CapsLock-4: F4
      CapsLock-5: F5
      CapsLock-6: F6
      CapsLock-7: F7
      CapsLock-8: F8
      CapsLock-9: F9
      CapsLock-0: F10
      CapsLock-MINUS: F11
      CapsLock-EQUAL: F12
      # Volume (] for up, \ for down)
      CapsLock-RIGHTBRACE: VolumeUp
      CapsLock-BACKSLASH: VolumeDown
      # Passthrough
      CapsLock-a: a
      CapsLock-b: b
      CapsLock-c: c
      CapsLock-e: e
      CapsLock-q: q
      CapsLock-s: s
      CapsLock-t: t
      CapsLock-v: v
      CapsLock-w: w
      CapsLock-x: x
      CapsLock-z: z

  # --- Katana Sub-legends on Windows key (Super / RightMeta) ---
  - name: Katana sub-legends
    remap:
      M-q: BrightnessDown
      M-w: BrightnessUp

  # --- Misc ---
  - name: Misc
    remap:
      Alt-BackSpace: A-Left
      PageUp: Home
