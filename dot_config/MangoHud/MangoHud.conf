### ==============================================================================
### MangoHud Configuration for CS2 & Competitive Benchmarking
### - Target System: ASUS TUF F16 (i5-13450HX + RTX 5050 Laptop)
### - Theme: Gruvbox Dark Rice Cohesion
### - Focus: Frametime consistency, 1% lows, GPU thermal/VRAM headroom, P-core load
### ==============================================================================

### Visual Layout & Appearance
legacy_layout=0
table_columns=3
font_size=18
background_alpha=0.45
background_color=282828
text_color=ebdbb2
text_outline
text_outline_color=1d2021
text_outline_thickness=1.5
position=top-left
round_corners=4

### Color Palette (Gruvbox Dark)
gpu_color=689d6a
cpu_color=458588
vram_color=d3869b
frametime_color=d79921
engine_color=fe8019

### Performance Metrics & Frametime Jitter
fps=1
fps_limit=165,0
frametime=1
fps_metrics=avg,0.01,0.001
frame_timing=1
histogram=0

### GPU Monitoring (NVIDIA RTX 5050 Laptop GPU)
gpu_stats=1
gpu_temp=1
gpu_core_clock=1
gpu_power=1
vram=1
throttling_status=1
throttling_status_graph=1

### CPU Monitoring (Intel Core i5-13450HX)
cpu_stats=1
cpu_temp=1
cpu_power=1
core_load=1

### Keybindings
# Toggle overlay visibility during gameplay
toggle_hud=Shift_R+F12
# Start/stop benchmark logging (outputs CSV to output_folder)
toggle_logging=Shift_L+F2
# Reset 1% and 0.1% low calculations
reset_fps_metrics=Shift_R+F9

### Benchmark Logging
output_folder=/home/manisk/.local/share/MangoHud/logs
log_duration=0
autostart_log=0
