################### High-Precision Gaming HUD — Intel & NVIDIA ###################
legacy_layout=0

### Visual Styling, Font & Layout
font_file=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Bold.ttf
font_file_text=/usr/share/fonts/TTF/JetBrainsMonoNerdFont-Medium.ttf
font_size=24
text_outline
text_outline_color=000000
text_outline_thickness=1.2
text_color=E2E8F0
background_color=0B0F14
background_alpha=0.50
round_corners=8
position=top-left
table_columns=3
toggle_hud=F9

### Hardware Binding
pci_dev=0000:01:00.0

### CPU Telemetry (Intel Raptor Lake i5-13450HX — Electric Blue)
cpu_stats
cpu_text=CPU
cpu_color=0091FF
cpu_load_change
cpu_load_value=50,85
cpu_load_color=38BDF8,F59E0B,EF4444
cpu_mhz
cpu_temp
cpu_power

### GPU Telemetry (NVIDIA GeForce RTX 5050 Mobile — GeForce Green)
gpu_stats
gpu_text=GPU
gpu_color=76B900
gpu_load_change
gpu_load_value=50,85
gpu_load_color=84CC16,F59E0B,EF4444
gpu_core_clock
gpu_mem_clock
gpu_temp
gpu_power

### Memory Subsystems (VRAM & RAM)
vram
vram_color=76B900
ram
ram_color=06B6D4

### Power & Battery
battery
battery_color=94A3B8
battery_watt

### Frame Pacing, Frame Generation & Engine
fps
engine_color=94A3B8
fps_color_change
fps_value=45,60
fps_color=EF4444,F59E0B,10B981
frame_timing
frametime_color=10B981

### Frame Limiting & Controls
fps_limit_method=late
toggle_fps_limit=F8
fps_limit=120,60,165

### Logging & Blacklist
output_folder=/home/manisk/.local/share/goverlay
log_interval=100
toggle_logging=Shift_L+F2
blacklist=zenity,protonplus,lsfg-vk-ui,bazzar,gnome-calculator,pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex
