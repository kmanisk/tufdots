# MangoHud Global Gaming Configuration for CachyOS + i3wm (1920x1200 165Hz)

### Performance & Limiting (Smooth Frame Pacing)
fps_limit=165,120,60
frametime=1
frame_timing=1

### Hardware Monitoring
gpu_stats
gpu_temp
gpu_core_clock
gpu_power

cpu_stats
cpu_temp
cpu_mhz
cpu_power

vram
ram

### Appearance
font_size=20
position=top-left
round_corners=8
background_alpha=0.4
font_color=ebdbb2
text_color=ebdbb2
gpu_color=b8bb26
cpu_color=fb4934
vram_color=d3869b
ram_color=83a598
engine_color=fabd2f
frametime_color=b8bb26

### Keybindings
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1
