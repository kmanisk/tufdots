# ==============================================================================
# WirePlumber Bluetooth Policy Configuration
# Prevents auto-switching to low-quality/broken HFP/HSP headset profile
# ==============================================================================
# On Linux, switching to the Bluetooth hands-free profile (HFP/HSP) causes:
# 1. SCO transport failures and complete audio cutouts on MediaTek BT controllers.
# 2. Severe audio quality degradation down to 8kHz/16kHz mono.
#
# By disabling autoswitch, Bluetooth audio stays locked to pristine stereo (A2DP),
# and microphone input is seamlessly handled by the laptop's built-in mic array.
# ==============================================================================

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.profile-preference = "latency"
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
