# ASUS TUF Gaming F16 (ALC256) — Dolby Atmos Speaker Acoustic Profile
# Native PipeWire Filter-Chain drop-in
# 
# Stages:
#   1. Biquad Acoustic Target EQ (builtin IIR biquads, zero overhead)
#   2. Matrix Stereo Spatialiser (Steve Harris LADSPA: natural soundstage widening)
#   3. Fast Lookahead Brickwall Limiter (Steve Harris LADSPA: -1.0 dBFS speaker protection)
#
# Directs processed stream into ALC256 hardware analog stereo sink.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "ASUS TUF Dolby Atmos (ALC256 Tuned)"
            media.name       = "ASUS TUF Dolby Atmos Sink"
            filter.graph = {
                nodes = [
                    # Left Channel EQ
                    { type = builtin name = eq_hpf_l  label = bq_highpass  control = { "Freq" = 90.0   "Q" = 0.707 } }
                    { type = builtin name = eq_low_l  label = bq_lowshelf  control = { "Freq" = 160.0  "Q" = 0.707 "Gain" = 2.5  } }
                    { type = builtin name = eq_warm_l label = bq_peaking   control = { "Freq" = 280.0  "Q" = 1.2   "Gain" = 2.0  } }
                    { type = builtin name = eq_dip_l  label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 2.0   "Gain" = -2.5 } }
                    { type = builtin name = eq_air_l  label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 3.0  } }

                    # Right Channel EQ
                    { type = builtin name = eq_hpf_r  label = bq_highpass  control = { "Freq" = 90.0   "Q" = 0.707 } }
                    { type = builtin name = eq_low_r  label = bq_lowshelf  control = { "Freq" = 160.0  "Q" = 0.707 "Gain" = 2.5  } }
                    { type = builtin name = eq_warm_r label = bq_peaking   control = { "Freq" = 280.0  "Q" = 1.2   "Gain" = 2.0  } }
                    { type = builtin name = eq_dip_r  label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 2.0   "Gain" = -2.5 } }
                    { type = builtin name = eq_air_r  label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.707 "Gain" = 3.0  } }

                    # Stage 2: Stereo Widening (Spatialiser)
                    {
                        type   = ladspa
                        name   = spatialiser
                        plugin = matrix_spatialiser_1422
                        label  = matrixSpatialiser
                        control = {
                            "Width" = 35.0
                        }
                    }

                    # Stage 3: Brickwall Peak Limiter (Speaker Voice-Coil Protection)
                    {
                        type   = ladspa
                        name   = limiter
                        plugin = fast_lookahead_limiter_1913
                        label  = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = 0.0
                            "Limit (dB)"      = -1.0
                            "Release time (s)" = 0.15
                        }
                    }
                ]
                links = [
                    # Left EQ chain
                    { output = "eq_hpf_l:Out"  input = "eq_low_l:In" }
                    { output = "eq_low_l:Out"  input = "eq_warm_l:In" }
                    { output = "eq_warm_l:Out" input = "eq_dip_l:In" }
                    { output = "eq_dip_l:Out"  input = "eq_air_l:In" }
                    { output = "eq_air_l:Out"  input = "spatialiser:Input L" }

                    # Right EQ chain
                    { output = "eq_hpf_r:Out"  input = "eq_low_r:In" }
                    { output = "eq_low_r:Out"  input = "eq_warm_r:In" }
                    { output = "eq_warm_r:Out" input = "eq_dip_r:In" }
                    { output = "eq_dip_r:Out"  input = "eq_air_r:In" }
                    { output = "eq_air_r:Out"  input = "spatialiser:Input R" }

                    # Spatialiser -> Brickwall Limiter
                    { output = "spatialiser:Output L" input = "limiter:Input 1" }
                    { output = "spatialiser:Output R" input = "limiter:Input 2" }
                ]
                inputs  = [ "eq_hpf_l:In" "eq_hpf_r:In" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "sink.dolby_atmos"
                node.description = "ASUS TUF Dolby Atmos (ALC256 Tuned)"
                media.class      = "Audio/Sink"
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name     = "playback.dolby_atmos"
                node.passive  = true
                target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }
]
